name: Validate

on:
  push:
  pull_request:
  # schedule:
  #   - cron: "0 0 * * *"

jobs:
  black:
    name: Check Black
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v2
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "./smartrent"

  flake8:
    name: Check Flake8
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v2
      - run: pip install flake8
      - run: flake8 smartrent

  tests:
    name: Run tests
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e . -r requirements_test.txt
      - run: pytest
